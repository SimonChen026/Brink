name: Brink
options:
  bundleIdPrefix: org.brinkgame
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: zh-Hans
  createIntermediateGroups: true
packages:
  BrinkCore:
    path: .
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
targets:
  Brink:
    type: application
    platform: macOS
    sources:
      - path: App
    dependencies:
      - package: BrinkCore
        product: BrinkCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: 绝境
        CFBundleName: 绝境
        CFBundleShortVersionString: "1.2.0"
        CFBundleVersion: "120"
        LSApplicationCategoryType: public.app-category.role-playing-games
        NSHumanReadableCopyright: "© 2026"
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.brinkgame.brink
        PRODUCT_NAME: Brink
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        GENERATE_INFOPLIST_FILE: NO
